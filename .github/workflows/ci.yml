name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          PYTHONWARNDEFAULTENCODING: "1"  # any file I/O without an explicit encoding fails (see pyproject.toml)

  baselines:
    # Rebuilds the dev/test split and the no-model baselines (scores and per-ticket answers)
    # from the committed data, and fails if anything differs from, or is missing from, what is
    # committed. No model runs here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: |
          tme split
          tme baselines
          changed=$(git status --porcelain data results)
          if [ -n "$changed" ]; then echo "Differs from what is committed:"; echo "$changed"; exit 1; fi
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  gate:
    # Replays the committed model answers (cassettes/), checks they give the committed results/,
    # and compares each condition with the target branch's results. Fails on a significant drop
    # in component, area, issue type or duplicate accuracy. No model runs here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Take the results from the target branch, not from this PR
        run: |
          mkdir -p .target
          git archive "origin/${{ github.base_ref }}" results | tar -x -C .target
      - run: tme gate --baseline .target/results
        env:
          PYTHONWARNDEFAULTENCODING: "1"
