# The model and prompts every condition uses. Changing any of them changes every request,
# so all conditions must be re-recorded against Ollama and the new cassettes committed.
model = "qwen3.5:4b"
think = false                          # Qwen3.5 thinks by default; off keeps answers short on a CPU
route_prompt = "prompts/route_v1.md"   # every condition
duplicate_prompt = "prompts/duplicates_v1.md"   # added when earlier tickets are shown (B)
